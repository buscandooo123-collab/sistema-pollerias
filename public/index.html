<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ef4444">
    <title>Sistema de Inventario - App Regreso</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .header {
            color: white;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .app-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: block;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .app-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        .app-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 15px;
        }
        .app-description {
            color: #6b7280;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            display: inline-block;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .info {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 12px;
            color: white;
            margin-top: 30px;
            font-size: 0.95rem;
        }
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .app-title { font-size: 1.6rem; }
            .app-icon { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐔 Sistema de Inventario</h1>
            <p class="subtitle">Bienvenido al Sistema</p>
        </div>

        <div class="app-card">
            <div class="app-icon">🔄</div>
            <div class="app-title">App Regreso</div>
            <div class="app-description">
                Registra las devoluciones de producto, calcula ganancias automáticamente y cierra las ventas del día.
            </div>
            <a href="/regreso/" class="btn">Acceder a App Regreso →</a>
        </div>

        <div class="info">
            💡 Inicia sesión con tu usuario para registrar los regresos
        </div>
    </div>

    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Error:', err));
        }
    </script>
</body>
</html>
